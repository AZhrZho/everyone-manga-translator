<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">EMT Logo — Dark Transparent</title>
  <desc id="desc">Transparent EMT logo for dark surfaces, preserving the violet M and pearl E/T lighting.</desc>

  <defs>
    <path id="tile-shape-c12" d="M256 40
      C379 40 416 42 444 70
      C472 98 472 135 472 256
      C472 377 472 414 444 442
      C416 470 379 472 256 472
      C133 472 96 470 68 442
      C40 414 40 377 40 256
      C40 135 40 98 68 70
      C96 42 133 40 256 40Z"/>
    <clipPath id="tile-clip-c12"><use href="#tile-shape-c12"/></clipPath>

    <linearGradient id="tile-tone-c12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#463B59"/>
      <stop offset="1" stop-color="#352E44"/>
    </linearGradient>
    <linearGradient id="pearl-light-c12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F6FA"/>
      <stop offset="0.62" stop-color="#F0EDF5"/>
      <stop offset="1" stop-color="#D7D3E2"/>
    </linearGradient>
    <linearGradient id="violet-light-c12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#916CDD"/>
      <stop offset="0.56" stop-color="#8057C7"/>
      <stop offset="1" stop-color="#6B49B3"/>
    </linearGradient>
    <filter id="letter-shadow-c12" x="-20%" y="-20%" width="140%" height="145%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.4" flood-color="#171320" flood-opacity=".20"/>
    </filter>
    <filter id="front-shadow-c12" x="-20%" y="-20%" width="140%" height="145%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2.1" flood-color="#171320" flood-opacity=".16"/>
    </filter>

    <path id="e-spine-c12" d="M126 94h48l-18 324h-48q-8 0-7-8l18-309q1-7 7-7z"/>
    <path id="e-top-c12" d="M126 94h115l-9 54H119z"/>
    <path id="e-mid-c12" d="M116 230h94l-11 52h-90z"/>
    <path id="e-bottom-c12" d="M117 364h115l10 54H111z"/>
    <path id="t-cap-c12" d="M350 94h104l-9 54h-96z"/>
    <path id="t-spine-c12" d="M390 142h38l30 276h-48z"/>
    <path id="m-body-c12" d="M204 418V120q0-26 24-26h20l38 86 38-86h20q24 0 24 26v298h-42V226l-18 48q-6 18-20 18t-20-18l-18-48v192z"/>

    <clipPath id="letters-clip-c12">
      <use href="#e-spine-c12"/><use href="#e-top-c12"/><use href="#e-mid-c12"/><use href="#e-bottom-c12"/>
      <use href="#m-body-c12"/><use href="#t-cap-c12"/><use href="#t-spine-c12"/>
    </clipPath>

    <path id="balloon-left-c12" d="M108 348
      C100 326 119 309 149 306
      C181 302 212 311 229 327
      C256 318 288 329 300 349
      C313 372 300 398 276 410
      C254 422 225 422 204 411
      C180 427 145 426 123 411
      C105 418 89 411 83 397
      L76 447L111 417
      C101 407 102 369 108 348Z"/>
    <path id="balloon-right-c12" d="M302 342
      C305 322 333 309 368 311
      C400 307 433 315 448 330
      C467 331 480 344 479 360
      C478 379 460 391 439 394
      L491 438L447 405
      C428 414 404 412 386 403
      C362 420 333 414 318 399
      C307 389 300 361 302 342Z"/>
  </defs>

  <g transform="translate(-26 0)">
    <!-- Each letter is composited as a whole before lighting is applied. -->
    <g fill="url(#pearl-light-c12)" filter="url(#letter-shadow-c12)">
      <use href="#e-spine-c12"/><use href="#e-top-c12"/><use href="#e-mid-c12"/><use href="#e-bottom-c12"/>
    </g>
    <use href="#m-body-c12" fill="url(#violet-light-c12)" filter="url(#letter-shadow-c12)"/>
    <g fill="url(#pearl-light-c12)" filter="url(#letter-shadow-c12)">
      <use href="#t-cap-c12"/><use href="#t-spine-c12"/>
    </g>

    <!-- Interlacing reuses the same letter lighting without any independent contact shadow. -->
    <g fill="url(#pearl-light-c12)">
      <use href="#e-mid-c12"/>
      <use href="#e-bottom-c12"/>
      <use href="#t-cap-c12"/>
    </g>

    <g clip-path="url(#letters-clip-c12)">
      <use href="#balloon-left-c12" fill="#302A3D" opacity=".11"/>
      <use href="#balloon-right-c12" fill="#302A3D" opacity=".09"/>
    </g>
  </g>
</svg>
